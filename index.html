<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poster & Banner Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="preview-wrap">
        <div class="stage" id="stage">
          <canvas id="canvas" width="1080" height="1920"></canvas>
          <aside class="layers" id="layersPanel">
            <div class="layers-head">
              <h3>Layers</h3>
              <button id="addLayerBtn" type="button">+ Add</button>
            </div>
            <div id="layersList" class="layers-list"></div>
          </aside>
        </div>
      </section>

      <section class="tool-panels">
        <div id="bgTools" class="tool-panel active">
          <label>Preset
            <select id="preset">
              <option value="1080x1920">Instagram Story</option>
              <option value="1080x1080">Instagram Post</option>
              <option value="1200x1200">Facebook Post</option>
              <option value="1080x2400">Full Screen Mobile</option>
            </select>
          </label>
          <label>Background Color
            <input id="bgColor" type="color" value="#1f2937" />
          </label>
        </div>

        <div id="imageTools" class="tool-panel">
          <label>Image Upload <input id="imgUpload" type="file" accept="image/*" /></label>
          <label>Scale <input id="imgScale" type="range" min="0.2" max="2" step="0.05" value="1" /></label>
          <label>Rotate <input id="imgRotate" type="range" min="-180" max="180" value="0" /></label>
          <label>Blend
            <select id="imgBlend">
              <option value="source-over">Normal</option>
              <option value="lighten">Lighten</option>
              <option value="darken">Darken</option>
              <option value="overlay">Overlay</option>
              <option value="screen">Screen</option>
            </select>
          </label>
        </div>

        <div id="textTools" class="tool-panel">
          <label>Text <input id="textValue" type="text" value="YOUR MESSAGE" /></label>
          <label>Size <input id="textSize" type="range" min="24" max="220" value="120" /></label>
          <label>Color <input id="textColor" type="color" value="#ffffff" /></label>
        </div>
      </section>
    </main>

    <footer class="bottom-bar">
      <button class="tool-toggle active" data-target="bgTools" type="button">Background</button>
      <button class="tool-toggle" data-target="imageTools" type="button">Image</button>
      <button class="tool-toggle" data-target="textTools" type="button">Text</button>
      <button id="downloadBtn" type="button">PNG</button>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
