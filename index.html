<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poster & Banner Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="splashScreen" class="splash-screen" aria-live="polite">
      <img src="assets/start-logo.svg" alt="App logo" class="splash-logo" />
      <p class="splash-title">RITESH GAIKWAD</p>
    </div>

    <section id="onboardingScreen" class="onboarding-screen hidden" aria-label="New user onboarding">
      <form id="onboardingForm" class="onboarding-card">
        <h2>Welcome</h2>
        <p>Create profile for auto-footer on banners.</p>
        <label>Photo
          <input id="userPhoto" type="file" accept="image/*" required />
        </label>
        <img id="userPhotoPreview" class="user-photo-preview hidden" alt="Profile preview" />
        <label>Name
          <input id="userName" type="text" placeholder="Your full name" required />
        </label>
        <label>Position
          <input id="userPosition" type="text" placeholder="Your position" required />
        </label>
        <label>Phone Number
          <input id="userPhone" type="tel" placeholder="Phone number" required />
        </label>
        <button id="saveProfileBtn" type="submit">Save & Continue</button>
      </form>
    </section>

    <main class="app">
      <section class="editor-wrap">
        <div class="canvas-shell">
          <canvas id="canvas" width="1080" height="1920"></canvas>
        </div>

        <section class="footer-template-controls">
          <h3>Banner Preset</h3>
          <div id="bannerPresetRow" class="preset-row"></div>

          <h3>Footer Preset</h3>
          <div id="footerPresetRow" class="preset-row"></div>
          <div id="footerPreviewRow" class="preview-row"></div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
