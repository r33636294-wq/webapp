<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poster & Banner Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="splashScreen" class="splash-screen" aria-live="polite">
      <img src="assets/start-logo.svg" alt="App logo" class="splash-logo" />
      <p class="splash-title">RITESH GAIKWAD</p>
    </div>

    <section id="onboardingScreen" class="onboarding-screen hidden" aria-label="New user onboarding">
      <form id="onboardingForm" class="onboarding-card">
        <h2>Welcome</h2>
        <p>Create profile for auto-footer on banners.</p>
        <label>Photo <input id="userPhoto" type="file" accept="image/*" required /></label>
        <img id="userPhotoPreview" class="user-photo-preview hidden" alt="Profile preview" />
        <label>Name <input id="userName" type="text" placeholder="Your full name" required /></label>
        <label>Position <input id="userPosition" type="text" placeholder="Your position" required /></label>
        <label>Phone Number <input id="userPhone" type="tel" placeholder="Phone number" required /></label>
        <button id="saveProfileBtn" type="submit">Save & Continue</button>
      </form>
    </section>

    <main class="app">
      <section class="editor-wrap">
        <div class="canvas-shell">
          <canvas id="canvas" width="1080" height="1920"></canvas>
        </div>

        <section class="control-panel">
          <h3>Banner Preset</h3>
          <div id="bannerPresetRow" class="preset-row"></div>

          <h3>Element Tools</h3>
          <div class="tool-row">
            <button id="toggleTextToolsBtn" type="button">Text Tools</button>
            <button id="toggleImageToolsBtn" type="button">Image Tools</button>
            <button id="addTextBtn" type="button">+ Add Text</button>
            <button id="addImageBtn" type="button">+ Add Image</button>
            <button id="addShapeBtn" type="button">+ Add Shape</button>
            <input id="hiddenImagePicker" type="file" accept="image/*" class="hidden" />
          </div>

          <section id="textToolsPanel" class="edit-box horizontal-tools hidden">
            <h4>Text Tool</h4>
            <label>Text <input id="textInput" type="text" /></label>
            <label>Size <input id="textSizeInput" type="range" min="18" max="180" value="54" /></label>
            <label>Font
              <select id="textFontInput">
                <option value="Inter, Arial, sans-serif">Inter</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
              </select>
            </label>
            <label>Color <input id="textColorInput" type="color" value="#ffffff" /></label>
            <label>Align
              <select id="textAlignInput">
                <option value="left">Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
              </select>
            </label>
          </section>

          <section id="imageToolsPanel" class="edit-box horizontal-tools hidden">
            <h4>Image Tool</h4>
            <button id="replaceImageBtn" type="button">Import/Replace Image</button>
            <label>Image Size <input id="imageScaleInput" type="range" min="0.2" max="2.5" step="0.05" value="1" /></label>

            <h4>Shape Tool</h4>
            <label>Shape Type
              <select id="shapeTypeInput">
                <option value="rect">Rectangle</option>
                <option value="circle">Circle</option>
              </select>
            </label>
            <label>Shape Color <input id="shapeColorInput" type="color" value="#22d3ee" /></label>
          </section>

          <h3>Footer Preset</h3>
          <div class="tool-row">
            <label>Color A <input id="footerColorA" type="color" value="#b91c1c" /></label>
            <label>Color B <input id="footerColorB" type="color" value="#dc2626" /></label>
            <label>Accent <input id="footerAccent" type="color" value="#facc15" /></label>
            <button id="saveFooterPresetBtn" type="button">Save Footer Preset</button>
          </div>
          <div id="footerPresetRow" class="preset-row"></div>
          <div id="footerPreviewRow" class="preview-row"></div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
