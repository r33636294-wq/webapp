<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poster & Banner Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>Poster / Banner Editor</h1>
        <p class="subtitle">Design social creatives with advanced image and text controls.</p>

        <div class="quick-controls">
          <label>
            Preset
            <select id="preset">
              <option value="1200x628">Social Banner (1200×628)</option>
              <option value="1080x1080">Instagram Post (1080×1080)</option>
              <option value="1200x1200">Facebook Post (1200×1200)</option>
              <option value="1080x1920">Instagram Story (1080×1920)</option>
              <option value="1080x1920">Facebook Story (1080×1920)</option>
              <option value="1080x2400">Full Screen Mobile (1080×2400)</option>
              <option value="2480x3508">A4 Poster (2480×3508)</option>
              <option value="1920x1080">Presentation Slide (1920×1080)</option>
            </select>
          </label>

          <label>
            Canvas Color
            <input id="bgColor" type="color" value="#1f2937" />
          </label>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="textTab" type="button">Text Tools</button>
          <button class="tab" data-tab="imageTab" type="button">Image Tools</button>
        </div>

        <section id="textTab" class="tab-panel active">
          <label>
            Add Text
            <input id="mainText" type="text" maxlength="120" value="YOUR MAIN MESSAGE" />
          </label>

          <div class="row">
            <label>
              Text Size
              <input id="textSize" type="range" min="24" max="260" value="120" />
            </label>
            <label>
              Color Mode
              <select id="textColorMode">
                <option value="solid">Solid</option>
                <option value="gradient">Gradient</option>
              </select>
            </label>
          </div>

          <div class="row">
            <label>
              Color A
              <input id="textColorA" type="color" value="#ffffff" />
            </label>
            <label>
              Color B
              <input id="textColorB" type="color" value="#ff7eb3" />
            </label>
          </div>

          <label>
            Texture (Select Image)
            <input id="textTextureImage" type="file" accept="image/*" />
          </label>

          <div class="row">
            <label>
              Stroke Width
              <input id="textStrokeWidth" type="range" min="0" max="24" value="0" />
            </label>
            <label>
              Stroke Color
              <input id="textStrokeColor" type="color" value="#000000" />
            </label>
          </div>

          <div class="row">
            <label>
              Shadow Type
              <select id="shadowType">
                <option value="none">None</option>
                <option value="outer">Outer</option>
                <option value="inner">Inner</option>
              </select>
            </label>
            <label>
              Shadow Color
              <input id="shadowColor" type="color" value="#000000" />
            </label>
          </div>

          <div class="row">
            <label>
              Shadow Radius
              <input id="shadowRadius" type="range" min="0" max="80" value="12" />
            </label>
            <label>
              Shadow Blur
              <input id="shadowBlur" type="range" min="0" max="80" value="16" />
            </label>
          </div>

          <div class="row">
            <label>
              Glow Type
              <select id="glowType">
                <option value="none">None</option>
                <option value="outer">Outer</option>
                <option value="inner">Inner</option>
              </select>
            </label>
            <label>
              Glow Color
              <input id="glowColor" type="color" value="#60a5fa" />
            </label>
          </div>

          <div class="row">
            <label>
              Glow Radius
              <input id="glowRadius" type="range" min="0" max="90" value="18" />
            </label>
            <label>
              Glow Blur
              <input id="glowBlur" type="range" min="0" max="90" value="28" />
            </label>
          </div>

          <p class="hint">Tip: Drag text on canvas to move. Drag corner handle to resize (mouse/touch).</p>
        </section>

        <section id="imageTab" class="tab-panel">
          <label>
            Import / Add Image
            <input id="bgImage" type="file" accept="image/*" />
          </label>

          <div class="row">
            <label>Crop Zoom<input id="imgZoom" type="range" min="0.4" max="3" step="0.05" value="1" /></label>
            <label>Resize<input id="imgScale" type="range" min="0.3" max="2" step="0.05" value="1" /></label>
          </div>
          <div class="row">
            <label>Move X<input id="imgX" type="range" min="-1" max="1" step="0.01" value="0" /></label>
            <label>Move Y<input id="imgY" type="range" min="-1" max="1" step="0.01" value="0" /></label>
          </div>
          <label>Rotate<input id="imgRotate" type="range" min="-180" max="180" step="1" value="0" /></label>

          <div class="row">
            <label>
              Color Fill
              <select id="imgColorMode">
                <option value="none">None</option>
                <option value="solid">Solid</option>
                <option value="gradient">Gradient</option>
              </select>
            </label>
            <label>
              Blend Mode
              <select id="imgBlend">
                <option value="source-over">Normal</option>
                <option value="lighten">Lighten</option>
                <option value="darken">Darken</option>
                <option value="overlay">Overlay</option>
                <option value="screen">Screen</option>
              </select>
            </label>
          </div>

          <div class="row">
            <label>Color A<input id="imgColorA" type="color" value="#ff6b6b" /></label>
            <label>Color B<input id="imgColorB" type="color" value="#4d96ff" /></label>
          </div>

          <div class="row">
            <label>
              Texture
              <select id="imgTexture">
                <option value="none">None</option>
                <option value="noise">Noise</option>
                <option value="grid">Grid</option>
              </select>
            </label>
            <label>Stroke Width<input id="imgStrokeWidth" type="range" min="0" max="30" step="1" value="0" /></label>
          </div>

          <div class="row">
            <label>Stroke Color<input id="imgStrokeColor" type="color" value="#ffffff" /></label>
            <label>Shadow Blur<input id="imgShadowBlur" type="range" min="0" max="80" step="1" value="0" /></label>
          </div>

          <div class="row">
            <label>Shadow X<input id="imgShadowX" type="range" min="-80" max="80" step="1" value="0" /></label>
            <label>Shadow Y<input id="imgShadowY" type="range" min="-80" max="80" step="1" value="0" /></label>
          </div>

          <label>Shadow Color<input id="imgShadowColor" type="color" value="#000000" /></label>
        </section>

        <div class="actions">
          <button id="downloadBtn">Download PNG</button>
          <button id="resetBtn" type="button" class="secondary">Reset</button>
        </div>
      </section>

      <section class="preview-wrap">
        <div id="stage" class="stage">
          <canvas id="canvas" width="1200" height="628"></canvas>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
